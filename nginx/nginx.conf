upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

#HTTP
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    #Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss image/svg+xml;

    #Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    #Health probe — exact match only, so the rest of /actuator stays unexposed.
    #Lets the frontend's server-status gate reach the backend; without this the
    #path falls into `location /` and the SPA returns 200, masking an outage.
    location = /actuator/health {
        proxy_pass            http://backend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
    }

    #API
    location /api/ {
        proxy_pass            http://backend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    90s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }

    #Frontend
    location / {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_cache_bypass  $http_upgrade;
    }
}