spring:
  application:
    name: oman-finance-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emppulse_db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}

alpaca:
  api-key-id: ${ALPACA_API_KEY_ID:}
  api-secret-key: ${ALPACA_API_SECRET_KEY:}
  trading-base-url: ${ALPACA_TRADING_BASE_URL:https://paper-api.alpaca.markets}
  data-base-url: ${ALPACA_DATA_BASE_URL:https://data.alpaca.markets}
  stream-url: ${ALPACA_STREAM_URL:wss://stream.data.alpaca.markets/v2/iex}
  connect-timeout: ${ALPACA_CONNECT_TIMEOUT:5s}
  read-timeout: ${ALPACA_READ_TIMEOUT:10s}
  bar-cache-retention: ${ALPACA_BAR_CACHE_RETENTION:7d}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
